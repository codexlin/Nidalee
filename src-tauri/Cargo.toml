[package]
name = "nidalee"
version = "2.0.0"
description = "Nidalee - 高性能、体积小巧的智能英雄联盟游戏助手"
authors = ["Nidalee Team <team@nidalee.com>"]
license = "MIT"
repository = "https://github.com/codexlin/Nidalee"
homepage = "https://github.com/codexlin/Nidalee"
documentation = "https://github.com/codexlin/Nidalee"
keywords = ["lol", "league-of-legends", "game", "assistant", "helper"]
categories = ["games"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nidalee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.9"
regex = "1.11.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"
percent-encoding = "2.3"
sysinfo = "0.35.2"
once_cell = "1.21.3"
futures-util = "0.3.31"
lazy_static = "1.5.0"
ts-rs = { version = "11.0.1", features = ["serde_json"] }
sha2 = "0.10.9"
mac_address = "1.1.8"
dirs = "5.0"
tauri-plugin-dialog = "2"
rand = "0.8"
thiserror = "2.0"
tauri-plugin-store = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.51"

[dev-dependencies]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
