name: 🚀 Build and Test

on:
  push:
    branches: [release-v3-dev]
  pull_request:
    branches: [release-v3-dev]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'

jobs:
  frontend-quality:
    name: 🧪 Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint code
        run: pnpm run lint

      - name: 🎨 Check formatting
        run: pnpm run format:check

      - name: 🧩 Type check
        run: pnpm run type-check

      - name: 🧪 Frontend tests
        run: pnpm run test

      - name: 🏗️ Build frontend
        run: pnpm run build-only

  rust-quality:
    name: 🦀 Rust quality
    runs-on: windows-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗄️ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🎨 Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: ✅ Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: 🧹 Prepare generated TypeScript contracts
        run: node scripts/prepare-types.mjs

      - name: 🧪 Cargo test
        working-directory: src-tauri
        run: |
          cargo test --lib --locked
          cargo test --test '*' --locked

      - name: 🔄 Sync generated TypeScript contracts
        run: node scripts/sync-types.mjs

      - name: 🧾 Verify generated TypeScript contracts
        run: git diff --exit-code -- src/types/global.d.ts

  build-tauri:
    name: 🏗️ Build Tauri App (Windows)
    needs: [frontend-quality, rust-quality]
    runs-on: windows-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: 🗄️ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_ENV: production
          VITE_WS_BASE_URL: ${{ vars.WS_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          args: ''

  build-tauri-mac:
    name: 🏗️ Build Tauri App (macOS)
    needs: [frontend-quality, rust-quality]
    runs-on: macos-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 🗄️ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_ENV: production
          VITE_WS_BASE_URL: ${{ vars.WS_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          args: ''
