name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  RUST_VERSION: '1.97.1'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release source and tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must use semantic versioning such as v1.0.0"
          }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Releases must be created from a commit contained in main'
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build-only

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Compile the exact feature set used by the Windows package and persist its
      # dependency artifacts for the downstream release job.
      - name: Build release application
        working-directory: src-tauri
        run: cargo build --release --locked --features custom-protocol

      - name: Prepare generated TypeScript contracts
        run: node scripts/prepare-types.mjs

      - name: Test Rust library and integrations
        working-directory: src-tauri
        run: |
          cargo test --lib --locked
          cargo test --test '*' --locked

      - name: Sync generated TypeScript contracts
        run: node scripts/sync-types.mjs

      - name: Verify generated TypeScript contracts
        run: git diff --exit-code -- src/types/global.d.ts

  prepare-release:
    name: Prepare draft release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          options=(--draft --verify-tag --title "Nidalee $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${options[@]}"

  release-windows:
    name: Build Windows release
    needs: prepare-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        shell: pwsh
        run: node scripts/apply-release-version.mjs $env:RELEASE_TAG

      - name: Build and upload Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_ENV: production
          VITE_WS_BASE_URL: ${{ vars.WS_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Nidalee ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: false
          args: --bundles msi

  release-macos:
    name: Build macOS universal release
    needs: prepare-release
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: node scripts/apply-release-version.mjs "$RELEASE_TAG"

      - name: Build and upload macOS release
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_ENV: production
          VITE_WS_BASE_URL: ${{ vars.WS_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Nidalee ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --target universal-apple-darwin --bundles dmg

  publish:
    name: Publish completed release
    needs: [release-windows, release-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs "$RELEASE_TAG" release-notes.md latest.json release-assets.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false
