<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
>
  <title>Nidalee</title>
  <defs>
    <linearGradient id="tile" x1="82" y1="64" x2="430" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C27" />
      <stop offset="1" stop-color="#081018" />
    </linearGradient>
    <linearGradient id="mark" x1="112" y1="88" x2="404" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BE8BC" />
      <stop offset="1" stop-color="#32D6A3" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)" />

  <g fill="url(#mark)">
    <!-- Left and right hunter strokes. Their angled terminals form the outer spear silhouette. -->
    <path d="M112 96 176 160v208l-64 64V96Z" />
    <path d="m336 160 64-64v336l-64-64V160Z" />

    <!-- The descending stroke keeps the mark unmistakably readable as an N. -->
    <path d="m112 128 32-48 256 256v48h-32L112 128Z" />

    <!-- A short, widened hunter pupil: visible at 24 px without becoming a drawn eye. -->
    <path d="m256 296 13 15v34l-13 15-13-15v-34l13-15Z" />
  </g>
</svg>
